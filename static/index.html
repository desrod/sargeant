<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>sargeant — sar viewer</title>
      <meta name="description" content="Browser viewer for sar (sysstat) reports — interactive charts for every metric, zero dependencies, exports to PDF.">
      <!-- Social cards (Open Graph + Twitter). og:image must stay an absolute
           URL; scrapers don't resolve relative paths reliably. -->
      <meta property="og:type" content="website">
      <meta property="og:site_name" content="sargeant">
      <meta property="og:title" content="sargeant — sar viewer">
      <meta property="og:description" content="Upload a sar text report and explore every sysstat metric as interactive charts. Zero dependencies, self-hostable, exports to PDF.">
      <meta property="og:url" content="https://sargeant.canonical.setuid.ai/">
      <meta property="og:image" content="https://sargeant.canonical.setuid.ai/static/og-card.png">
      <meta property="og:image:width" content="1200">
      <meta property="og:image:height" content="630">
      <meta name="twitter:card" content="summary_large_image">
      <meta name="twitter:title" content="sargeant — sar viewer">
      <meta name="twitter:description" content="Upload a sar text report and explore every sysstat metric as interactive charts. Zero dependencies, self-hostable, exports to PDF.">
      <meta name="twitter:image" content="https://sargeant.canonical.setuid.ai/static/og-card.png">
      <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
      <link rel="stylesheet" href="/static/uplot.css">
      <link rel="stylesheet" href="/static/vanilla.css">
   </head>
   <body>
      <header class="p-navigation">
         <div class="p-navigation__banner">
            <span class="p-navigation__logo">sg</span>
            <span class="p-navigation__title">sargeant</span>
            <span class="p-navigation__meta" id="host-meta"></span>
         </div>
      </header>
      <div class="l-shell">
         <aside class="l-aside">
            <div class="aside-block" id="upload-block" hidden>
               <h3>Upload sar data</h3>
               <input type="file" id="upload-input" multiple autocomplete="off">
               <button class="p-button" id="upload-btn" type="button">Upload &amp; analyze</button>
               <p class="upload-status" id="upload-status"></p>
            </div>
            <div class="aside-block">
               <h3>Day</h3>
               <select id="file-select" autocomplete="off"></select>
            </div>
            <div class="aside-block">
               <h3>Export</h3>
               <button class="p-button" id="export-btn" type="button" disabled>Export PDF</button>
               <p class="upload-status">Saves the selected metric's charts, series, and zoom window.</p>
            </div>
            <div class="aside-block" style="padding-left:0;padding-right:0;">
               <h3 style="padding:0 1.25rem;">Metrics</h3>
               <ul class="p-side-nav" id="section-list"></ul>
            </div>
         </aside>
         <main class="l-main">
            <div id="entity-bar" class="u-hide">
               <label>Series</label>
               <div class="p-chip-row" id="entity-chips"></div>
            </div>
            <div id="charts"></div>
            <div id="empty" class="p-empty">Select a metric on the left to plot it.</div>
         </main>
      </div>
      <script src="/static/uplot.js"></script>
      <script src="/static/app.js"></script>
   </body>
</html>
